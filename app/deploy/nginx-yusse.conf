# Bloque para Yussè Clip. Sustituye HOST por el nombre de la VPS (srvXXXXXXX.hstgr.cloud).
# Si en la VPS no existe ya un "map $http_upgrade $connection_upgrade", deja el map de abajo.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name HOST;
    client_max_body_size 4G;          # subida de videos grandes
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;          # tiempo real
        proxy_set_header Connection $connection_upgrade; # tiempo real
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

